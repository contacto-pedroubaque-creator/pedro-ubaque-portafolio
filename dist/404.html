<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Pedro Ubaque</title>
  <meta name="theme-color" content="#09090b">
  <link rel="icon" type="image/webp" href="assets/Yo_perfil.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.min.css">
  <link rel="stylesheet" href="enhancements.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #09090b;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      background-image: radial-gradient(circle at 50% 30%, rgba(255, 87, 34, 0.12) 0%, transparent 65%);
    }

    .error-container {
      max-width: 580px;
      background: rgba(18, 22, 34, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 36px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
    }

    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #ff5722;
      line-height: 1;
      margin: 0 0 16px 0;
      text-shadow: 0 0 32px rgba(255, 87, 34, 0.4);
    }

    .error-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 2.2rem;
      font-weight: 400;
      margin: 0 0 16px 0;
      color: #ffffff;
    }

    .error-desc {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      margin: 0 0 32px 0;
    }

    .error-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-404-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ff5722;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 26px;
      border-radius: 999px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 4px 20px rgba(255, 87, 34, 0.4);
    }

    .btn-404-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 87, 34, 0.6);
    }

    .btn-404-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 14px 26px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .btn-404-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>

<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Escenario fuera de programa</h1>
    <p class="error-desc">La página o recurso que buscas no existe o ha sido reubicada. Puedes volver al inicio o explorar el portafolio escénico.</p>
    <div class="error-actions">
      <a href="index.html" class="btn-404-primary">← Volver al Inicio</a>
      <a href="projects.html" class="btn-404-secondary">Ver Portafolio Escénico</a>
    </div>
  </div>
</body>

</html>
